<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form>
        <table border="">
            <tr>
                <td><label for="name">Student name:</label></td>
                <td>
                    <input type="text" id="name" name="name" placeholder="Enter your name">
                </td>
            </tr>

            <tr>
                <td><label for="email">Email:</label></td>
                <td>
                    <input type="email" name="email" id="email" placeholder="Enter your email">
                </td>
            </tr>

            <tr>
                <td><label for="password">Password:</label></td>
                <td>
                    <input type="password" name="password" placeholder="Enter password">
                </td>
            </tr>

            <tr>
                <td>Gender:</td>
                <td>
                    <input type="radio" id="male" name="gender" value="Male">
                    <label for="male">Male</label>

                    <input type="radio" id="female" name="gender" value="Female">
                    <label for="female">Female</label>
                </td>
            </tr>
            <tr>
                <td>Skills:</td>
                <td>
                    <input type="checkbox" id="java" name="skills" value="Java">
                    <label for="java">Java</label>

                    <input type="checkbox" id="python" name="skills" value="python">
                    <label for="python">Python</label>

                    <input type="checkbox" di="html" name="skills" value="HTML">
                    <label for="html">HTML</label>
                </td>
            </tr>
            <tr>
                <td><label for="course">=Course:</label></td>
                <td>
                    <select name="course" id="course">
                        <option value="">--Select Course--</option>
                        <option value="java">Java Full Stack</option>
                        <option value="python">Python Full Stack</option>
                        <option value="mern">MERN Stack</option>
                    </select>

                </td>
            </tr>

            <tr>
                <td><label for="dob">Date of Birth</label></td>
                <td>
                    <input type="date" name="dob" id="dob">
                </td>
            </tr>
            <tr>
                <td><label for="address">Address:</label></td>
                <td>
                    <textarea name="address" id="address" rows="4" cols="30"
                        placeholder="Enter your address"></textarea>
                </td>
            </tr>

                <td colspan="2"><center><button>submit</button><button>clear</button></center></td>
                

            </tr>
        </table>

    </form>
</body>

</html>
