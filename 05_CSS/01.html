<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
        }

        table,
        th,
        td {
            border: 2px solid grey;
            border-collapse: collapse;
            text-align: center;
            font-size: 20px;
            padding: 20px;

        }

        table {
            width: 100%;
        }

        th {
            background-color: blueviolet;
        }

        tr:nth-child(even) {
            background-color: blue;

        }

        tr:nth-child(odd) {
            background-color: pink;
        }

        th,
        td {
            border-radius: 50px;
        }

        tr:hover {
            background-color: cadetblue;
            color: white;
        }
    </style>
</head>

<body>
    <table>
        <tr>
            <th>EMPLOYEE NAME</th>
            <th>Designation</th>
            <th>Company</th>
        </tr>
        <tr>
            <td>Deepika</td>
            <td>MANAGER</td>
            <td>TCS</td>
        </tr>
        <tr>
            <td>rashmilka</td>
            <td>DEVELOPER</td>
            <td>INFOSYS</td>
        </tr>
        <tr>
            <td>Katappa</td>
            <td>TESTER</td>
            <td>GOOGLE</td>
        </tr>
    </table>

    <br><br><br><br>
    <hr>
    <br><br><br><br>
</body>

</html>
